# Render Blueprint — Node runtime (no Docker). More reliable on free/starter plans.
# https://dashboard.render.com → New → Blueprint → this repo

services:
  - type: web
    name: sketch-photoreal
    runtime: node
    plan: starter
    region: oregon
    nodeVersion: "20"
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /unlock
    disk:
      name: photoreal-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      - key: DATABASE_URL
        value: file:/data/photoreal.db
      - key: USD_PKR_RATE
        value: "278"
      - key: SITE_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: FAL_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
