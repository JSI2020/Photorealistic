# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this GitHub repo in Render, then apply the blueprint (or create a
# Web Service manually from the Dockerfile).

services:
  - type: web
    name: sketch-photoreal
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /unlock
    disk:
      name: photoreal-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/data/photoreal.db
      - key: USD_PKR_RATE
        value: "278"
      - key: SITE_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: FAL_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
